<!DOCTYPE html>
<html lang="en-US">
  <head>
    <link rel="stylesheet" href="/assets/uni.bf09a7ac.css">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title></title>
    <script>
      // 用上次打开时存下的店铺名和 logo 先设好标题、标签图标（App.vue 存的 h5_head），避免每次刷新先闪平台默认 logo。
      // 国内站 EdgeOne 中间件已经按域名写好（有 x-seo 标记 / 图标不是默认的）时不动。
      (function () {
        try {
          var h = JSON.parse(localStorage.getItem('h5_head') || 'null');
          if (!h) return;
          if (h.title && !document.querySelector('meta[name="x-seo"]')) document.title = h.title;
          var link = document.querySelector('link[rel="icon"]');
          if (h.icon && link && /\/static\/logo\.png$/.test(link.getAttribute('href') || '')) link.setAttribute('href', h.icon);
        } catch (e) {}
      })();
    </script>
    <!--preload-links-->
    <!--app-context-->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script type="module" crossorigin src="/assets/index-BQgtzoUD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-OMDCARNG.css">
  </head>
  <body>
    <div id="app"><!--app-html--></div>
  </body>
</html>
